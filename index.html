<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>J.A.R.V.I.S.</title>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">J</span><div><div class="brand-name">J.A.R.V.I.S.</div><div class="brand-sub">PERSONAL AI INTERFACE</div></div></div>
      <div class="status"><span class="status-dot"></span><span id="systemStatus">SYSTEM ONLINE</span></div>
    </header>

    <section class="hero">
      <div class="eyebrow">VOICE-ASSISTED INTELLIGENCE</div>
      <div class="orb-wrap" id="orbWrap">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        <div class="orb"><div class="orb-core"></div><div class="orb-shine"></div></div>
        <div class="orb-cross cross-x"></div><div class="orb-cross cross-y"></div>
      </div>
      <div class="assistant-state" id="assistantState">STANDBY</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">INITIALIZING</div>
      <p class="intro" id="intro">お呼びでしょうか。何をお手伝いしましょう？</p>
      <button class="mic-button" id="micButton" aria-label="音声入力"><span class="mic-icon">🎙</span><span id="micLabel">タップして話す</span></button>
      <div class="mic-note" id="micNote">音声入力は対応ブラウザで利用できます</div>
    </section>

    <section class="console">
      <div class="console-heading"><span>COMMUNICATION LOG</span><button id="clearButton" class="text-button">CLEAR</button></div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="message jarvis"><div class="speaker">JARVIS</div><div>システムを起動しました。テキストまたは音声でご指示ください。</div></div>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatInput" type="text" autocomplete="off" placeholder="Jarvisにメッセージを送信…" aria-label="メッセージ">
        <button type="submit" class="send-button" aria-label="送信">➤</button>
      </form>
    </section>

    <section class="quick-actions">
      <button class="quick" data-command="今何時？"><span>◷</span>時刻</button>
      <button class="quick" data-command="今日の日付を教えて"><span>▦</span>日付</button>
      <button class="quick" data-command="あなたにできることを教えて"><span>⌘</span>ヘルプ</button>
    </section>
    <footer>J.A.R.V.I.S. • PERSONAL ASSISTANT <span>v0.1</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
